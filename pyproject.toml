[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gana-recommender"
version = "1.0.0"
description = "Motor de recomendação híbrido do Gana, rede social de livros: FastAPI, Supabase, Google Books, cold start e LGPD."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Maria Cecília Torres Vianna" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "python-dotenv>=1",
    "typer>=0.12",
]

[project.optional-dependencies]
supabase = ["supabase>=2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
gana = "gana.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
# a pasta supabase/ (migrações) confunde a detecção de pacote local
known-third-party = ["supabase"]
